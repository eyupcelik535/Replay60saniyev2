      - name: 60 saniye tampon duzeltmesi
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('ReplayGeriyeDonuk_v2/app/src/main')
          buffer_java = root / 'java/com/example/replaygeri/ReplayBuffer.java'
          assert buffer_java.is_file(), f'Dosya bulunamadi: {buffer_java}'
          src = buffer_java.read_text(encoding='utf-8')

          def change_long_constant(name, replacement):
              global src
              pattern = (r'(?m)^(\s*(?:(?:private|public|protected)\s+)?'
                         r'(?:static\s+final|final\s+static)\s+long\s+'
                         + re.escape(name) + r'\s*=\s*)[^;]+;')
              matches = list(re.finditer(pattern, src))
              assert len(matches) == 1, f'{name} tanimi bulunamadi veya birden fazla: {len(matches)}'
              src = re.sub(pattern, lambda m: m.group(1) + replacement + ';', src, count=1)

          # 180 MiB'lik sinir bazi cihazlarda 60 saniye tamamlanmadan dolabilir.
          # 384 MiB butce 60 saniyelik icerik icin daha fazla alan saglar.
          change_long_constant('MAX_VIDEO_BYTES', '384L * 1024L * 1024L')
          # Keyframe ve onbellek icin fazladan 10 saniyelik zaman penceresi.
          change_long_constant('KEEP_US', '70L * 1000000L')
          buffer_java.write_text(src, encoding='utf-8')

          # Daha buyuk tamponun Android heap tarafindan kesilmesini azaltir.
          manifest = root / 'AndroidManifest.xml'
          xml = manifest.read_text(encoding='utf-8')
          assert '<application' in xml, 'Manifest application etiketi bulunamadi'
          if re.search(r'android:largeHeap\s*=', xml):
              xml = re.sub(r'android:largeHeap\s*=\s*"[^"]*"',
                           'android:largeHeap="true"', xml, count=1)
          else:
              xml = xml.replace('<application', '<application android:largeHeap="true"', 1)
          manifest.write_text(xml, encoding='utf-8')
          print('Replay V7: MAX_VIDEO_BYTES=384 MiB, KEEP_US=70 sn, largeHeap=true')
          PY

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Android 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: APK derle
        working-directory: ReplayGeriyeDonuk_v2
        run: gradle --no-daemon :app:assembleDebug

      - name: APK dosyasini yayimla
        uses: actions/upload-artifact@v4
        with:
          name: Replay-V7-60s-Logo-APK
          path: ReplayGeriyeDonuk_v2/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
