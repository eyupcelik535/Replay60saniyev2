
name: Astra 720p60 Codec Test V3

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "SDK: $SDK"
          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            MANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          else
            MANAGER="$(command -v sdkmanager)"
          fi
          yes | "$MANAGER" --licenses >/dev/null || true
          "$MANAGER" 'platforms;android-35' 'build-tools;35.0.0'
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Projeyi olustur
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname settings.gradle)"
          cat > settings.gradle <<'ASTRA_FILE_0_END'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = 'Astra720p60'
          include ':app'
          ASTRA_FILE_0_END

          mkdir -p "$(dirname build.gradle)"
          cat > build.gradle <<'ASTRA_FILE_1_END'
          plugins { id 'com.android.application' version '8.9.2' apply false }
          ASTRA_FILE_1_END

          mkdir -p "$(dirname gradle.properties)"
          cat > gradle.properties <<'ASTRA_FILE_2_END'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          ASTRA_FILE_2_END

          mkdir -p "$(dirname app/build.gradle)"
          cat > app/build.gradle <<'ASTRA_FILE_3_END'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.astratest.codec'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.astratest.codec'
                  minSdk 29
                  targetSdk 35
                  versionCode 3
                  versionName '3.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          ASTRA_FILE_3_END

          mkdir -p "$(dirname app/src/main/AndroidManifest.xml)"
          cat > app/src/main/AndroidManifest.xml <<'ASTRA_FILE_4_END'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application android:label="Astra Codec Test V3" android:theme="@android:style/Theme.Material.Light.NoActionBar" android:allowBackup="false">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
                </intent-filter>
              </activity>
            </application>
          </manifest>
          ASTRA_FILE_4_END

          mkdir -p "$(dirname app/src/main/java/com/astratest/codec/MainActivity.java)"
          cat > app/src/main/java/com/astratest/codec/MainActivity.java <<'ASTRA_FILE_5_END'
          package com.astratest.codec;

          import android.app.Activity;
          import android.content.Intent;
          import android.media.MediaCodec;
          import android.media.MediaCodecInfo;
          import android.media.MediaCodecList;
          import android.media.MediaFormat;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.Surface;
          import android.view.View;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;

          public class MainActivity extends Activity {
              private TextView output;
              private Button test, share;
              private String result = "";

              @Override public void onCreate(Bundle state) {
                  super.onCreate(state);
                  LinearLayout layout = new LinearLayout(this);
                  layout.setOrientation(LinearLayout.VERTICAL);
                  layout.setPadding(24, 24, 24, 24);
                  TextView header = new TextView(this);
                  header.setText("ASTRA 720p60 KODLAYICI TESTI");
                  header.setTextSize(22);
                  layout.addView(header);
                  test = new Button(this);
                  test.setText("KODLAYICILARI TEST ET");
                  layout.addView(test);
                  share = new Button(this);
                  share.setText("RAPORU PAYLAS");
                  share.setEnabled(false);
                  layout.addView(share);
                  output = new TextView(this);
                  output.setText("Hazir. Teste bas. Bu uygulama TikTok ayarlarini degistirmez.");
                  output.setTextSize(13);
                  output.setTextIsSelectable(true);
                  ScrollView scroll = new ScrollView(this);
                  scroll.addView(output);
                  layout.addView(scroll, new LinearLayout.LayoutParams(-1, 0, 1));
                  setContentView(layout);

                  test.setOnClickListener(new View.OnClickListener() {
                      @Override public void onClick(View v) { runTest(); }
                  });
                  share.setOnClickListener(new View.OnClickListener() {
                      @Override public void onClick(View v) {
                          Intent send = new Intent(Intent.ACTION_SEND);
                          send.setType("text/plain");
                          send.putExtra(Intent.EXTRA_TEXT, result);
                          startActivity(Intent.createChooser(send, "Codec raporunu paylas"));
                      }
                  });
              }

              private void runTest() {
                  test.setEnabled(false);
                  share.setEnabled(false);
                  output.setText("MediaCodec bilgileri okunuyor...");
                  new Thread(new Runnable() {
                      @Override public void run() {
                          String data;
                          try { data = scan(); }
                          catch (Throwable e) { data = "Test hatasi: " + e.toString(); }
                          final String report = data;
                          runOnUiThread(new Runnable() {
                              @Override public void run() {
                                  result = report;
                                  output.setText(report);
                                  test.setEnabled(true);
                                  share.setEnabled(true);
                              }
                          });
                      }
                  }).start();
              }

              private String scan() {
                  StringBuilder sb = new StringBuilder();
                  sb.append("ASTRA 720p60 TEST V3\n")
                    .append("Cihaz: ").append(Build.MANUFACTURER).append(" ").append(Build.MODEL).append("\n")
                    .append("Android: ").append(Build.VERSION.RELEASE).append(" | API ").append(Build.VERSION.SDK_INT).append("\n\n");
                  int count = 0;
                  int hardware60 = 0;
                  MediaCodecInfo[] codecs = new MediaCodecList(MediaCodecList.ALL_CODECS).getCodecInfos();
                  for (MediaCodecInfo info : codecs) {
                      if (!info.isEncoder()) continue;
                      if (Build.VERSION.SDK_INT >= 29 && info.isAlias()) continue;
                      for (String mime : info.getSupportedTypes()) {
                          if (!MediaFormat.MIMETYPE_VIDEO_AVC.equalsIgnoreCase(mime) &&
                              !MediaFormat.MIMETYPE_VIDEO_HEVC.equalsIgnoreCase(mime)) continue;
                          count++;
                          sb.append("=====================\n")
                            .append(info.getName()).append("\n")
                            .append(MediaFormat.MIMETYPE_VIDEO_AVC.equalsIgnoreCase(mime) ? "H.264" : "H.265")
                            .append(" | Donanim: ").append(info.isHardwareAccelerated()).append("\n");
                          try {
                              MediaCodecInfo.CodecCapabilities caps = info.getCapabilitiesForType(mime);
                              MediaCodecInfo.VideoCapabilities v = caps.getVideoCapabilities();
                              if (v == null) { sb.append("VideoCapabilities yok\n"); continue; }
                              boolean horizontal30 = supported(v,1280,720,30);
                              boolean horizontal60 = supported(v,1280,720,60);
                              boolean vertical30 = supported(v,720,1280,30);
                              boolean vertical60 = supported(v,720,1280,60);
                              sb.append("1280x720 30 FPS: ").append(horizontal30).append("\n")
                                .append("1280x720 60 FPS: ").append(horizontal60).append("\n")
                                .append("720x1280 30 FPS: ").append(vertical30).append("\n")
                                .append("720x1280 60 FPS: ").append(vertical60).append("\n")
                                .append("1920x1080 60 FPS: ").append(supported(v,1920,1080,60)).append("\n");
                              boolean surface = false;
                              for (int f : caps.colorFormats) {
                                  if (f == MediaCodecInfo.CodecCapabilities.COLOR_FormatSurface) surface = true;
                              }
                              sb.append("Surface girisi: ").append(surface).append("\n");
                              if (info.isHardwareAccelerated() && (horizontal60 || vertical60)) hardware60++;
                              if (info.isHardwareAccelerated() && surface && (horizontal60 || vertical60)) {
                                  int w = horizontal60 ? 1280 : 720;
                                  int h = horizontal60 ? 720 : 1280;
                                  sb.append("720p60 baslatma: ").append(start(info.getName(),mime,w,h)).append("\n");
                              }
                          } catch (Exception e) {
                              sb.append("Codec hatasi: ").append(e.toString()).append("\n");
                          }
                      }
                  }
                  sb.append("\nTOPLAM H264/H265: ").append(count)
                    .append("\n720p60 bildiren donanim codec: ").append(hardware60)
                    .append("\n\nNot: Bu test sadece Android'in bildirdigi codec kabiliyetini ")
                    .append("ve encoder baslatilmasini olcer. Gercek 60 FPS yayin veya TikTok sunucu izni olcumu degildir.\n");
                  return sb.toString();
              }

              private boolean supported(MediaCodecInfo.VideoCapabilities v, int w, int h, int fps) {
                  try { return v.areSizeAndRateSupported(w,h,fps); }
                  catch (Exception e) { return false; }
              }

              private String start(String codecName, String mime, int w, int h) {
                  MediaCodec codec = null;
                  Surface surface = null;
                  boolean started = false;
                  try {
                      codec = MediaCodec.createByCodecName(codecName);
                      MediaFormat f = MediaFormat.createVideoFormat(mime,w,h);
                      f.setInteger(MediaFormat.KEY_COLOR_FORMAT,MediaCodecInfo.CodecCapabilities.COLOR_FormatSurface);
                      f.setInteger(MediaFormat.KEY_FRAME_RATE,60);
                      f.setInteger(MediaFormat.KEY_BIT_RATE,5000000);
                      f.setInteger(MediaFormat.KEY_I_FRAME_INTERVAL,2);
                      codec.configure(f,null,null,MediaCodec.CONFIGURE_FLAG_ENCODE);
                      surface = codec.createInputSurface();
                      codec.start();
                      started = true;
                      return "BASARILI (gercek FPS olculmedi)";
                  } catch (Exception e) {
                      return "BASARISIZ: " + e.toString();
                  } finally {
                      if (codec != null) {
                          if (started) try { codec.stop(); } catch (Exception ignored) { }
                          try { codec.release(); } catch (Exception ignored) { }
                      }
                      if (surface != null) surface.release();
                  }
              }
          }
          ASTRA_FILE_5_END

      - name: APK derle
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --console=plain --stacktrace 2>&1 | tee build.log

      - name: APK yukle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Astra-Codec-Test-V3-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Hata gunlugunu yukle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Astra-V3-Derleme-Hata-Raporu
          path: build.log
          if-no-files-found: ignore
