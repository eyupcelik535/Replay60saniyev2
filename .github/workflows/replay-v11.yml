
name: Astra Codec Test V4 - Gradle Yok

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK araclarini hazirla
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "SDK=$SDK" >> "$GITHUB_ENV"
          test -d "$SDK" || { echo 'Android SDK bulunamadi'; exit 1; }
          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            MANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          else
            MANAGER="$(command -v sdkmanager)"
          fi
          yes | "$MANAGER" --licenses >/dev/null || true
          "$MANAGER" 'platforms;android-35' 'build-tools;35.0.0'
          test -f "$SDK/platforms/android-35/android.jar"
          for app in aapt2 d8 zipalign apksigner; do
            test -x "$SDK/build-tools/35.0.0/$app" || { echo "$app bulunamadi"; exit 1; }
          done

      - name: Android kaynak dosyalarini olustur
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src/com/astratest/codec build/classes build/dex
          cat > AndroidManifest.xml <<'MANIFEST_END'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.astratest.codec"
              android:versionCode="4"
              android:versionName="4.0">
              <uses-sdk android:minSdkVersion="29" android:targetSdkVersion="35" />
              <application android:allowBackup="false"
                  android:label="Astra Codec Test V4"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          MANIFEST_END

          cat > src/com/astratest/codec/MainActivity.java <<'JAVA_END'
          package com.astratest.codec;

          import android.app.Activity;
          import android.content.Intent;
          import android.media.MediaCodec;
          import android.media.MediaCodecInfo;
          import android.media.MediaCodecList;
          import android.media.MediaFormat;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.Surface;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;

          public class MainActivity extends Activity {
              private TextView view;
              private Button runButton, shareButton;
              private String report = "";

              @Override
              public void onCreate(Bundle state) {
                  super.onCreate(state);
                  LinearLayout main = new LinearLayout(this);
                  main.setOrientation(LinearLayout.VERTICAL);
                  main.setPadding(24, 24, 24, 24);
                  TextView title = new TextView(this);
                  title.setText("ASTRA 720p60 CODEC TEST V4");
                  title.setTextSize(21);
                  main.addView(title);
                  runButton = new Button(this);
                  runButton.setText("KODLAYICILARI TEST ET");
                  main.addView(runButton);
                  shareButton = new Button(this);
                  shareButton.setText("RAPORU PAYLAS");
                  shareButton.setEnabled(false);
                  main.addView(shareButton);
                  view = new TextView(this);
                  view.setText("Hazir. TikTok ayarlarina dokunulmaz.");
                  view.setTextSize(13);
                  view.setTextIsSelectable(true);
                  ScrollView scroll = new ScrollView(this);
                  scroll.addView(view);
                  main.addView(scroll, new LinearLayout.LayoutParams(-1, 0, 1));
                  setContentView(main);
                  runButton.setOnClickListener(v -> startTest());
                  shareButton.setOnClickListener(v -> {
                      Intent intent = new Intent(Intent.ACTION_SEND);
                      intent.setType("text/plain");
                      intent.putExtra(Intent.EXTRA_TEXT, report);
                      startActivity(Intent.createChooser(intent, "Raporu paylas"));
                  });
              }

              private void startTest() {
                  runButton.setEnabled(false);
                  shareButton.setEnabled(false);
                  view.setText("Test calisiyor...");
                  new Thread(() -> {
                      String output;
                      try { output = scan(); }
                      catch (Throwable ex) { output = "HATA: " + ex.toString(); }
                      final String finalOutput = output;
                      runOnUiThread(() -> {
                          report = finalOutput;
                          view.setText(finalOutput);
                          runButton.setEnabled(true);
                          shareButton.setEnabled(true);
                      });
                  }).start();
              }

              private String scan() {
                  StringBuilder b = new StringBuilder();
                  b.append("ASTRA 720p60 / MEDIACODEC RAPORU\n")
                   .append(Build.MANUFACTURER).append(" ").append(Build.MODEL)
                   .append(" / Android ").append(Build.VERSION.RELEASE).append("\n\n");
                  int count = 0, hw60 = 0;
                  MediaCodecInfo[] infos = new MediaCodecList(MediaCodecList.ALL_CODECS).getCodecInfos();
                  for (MediaCodecInfo info : infos) {
                      if (!info.isEncoder() || info.isAlias()) continue;
                      for (String mime : info.getSupportedTypes()) {
                          boolean avc = MediaFormat.MIMETYPE_VIDEO_AVC.equalsIgnoreCase(mime);
                          boolean hevc = MediaFormat.MIMETYPE_VIDEO_HEVC.equalsIgnoreCase(mime);
                          if (!avc && !hevc) continue;
                          count++;
                          b.append("\nKODLAYICI: ").append(info.getName())
                           .append(" / ").append(avc ? "H.264" : "H.265")
                           .append(" / Donanim: ").append(info.isHardwareAccelerated()).append("\n");
                          try {
                              MediaCodecInfo.CodecCapabilities caps = info.getCapabilitiesForType(mime);
                              MediaCodecInfo.VideoCapabilities v = caps.getVideoCapabilities();
                              if (v == null) { b.append("Video yetenekleri yok\n"); continue; }
                              boolean h30 = support(v, 1280, 720, 30);
                              boolean h60 = support(v, 1280, 720, 60);
                              boolean d30 = support(v, 720, 1280, 30);
                              boolean d60 = support(v, 720, 1280, 60);
                              b.append("1280x720 30: ").append(h30)
                               .append(" / 60: ").append(h60)
                               .append("\n720x1280 30: ").append(d30)
                               .append(" / 60: ").append(d60).append("\n");
                              if (info.isHardwareAccelerated() && (h60 || d60)) hw60++;
                              boolean surface = false;
                              for (int c : caps.colorFormats) {
                                  if (c == MediaCodecInfo.CodecCapabilities.COLOR_FormatSurface) surface = true;
                              }
                              if (surface && (h60 || d60)) {
                                  b.append("720p60 encoder baslatma: ")
                                   .append(tryStart(info.getName(), mime, h60 ? 1280 : 720,
                                                    h60 ? 720 : 1280)).append("\n");
                              }
                          } catch (Exception ex) {
                              b.append("Codec sorgu hatasi: ").append(ex.toString()).append("\n");
                          }
                      }
                  }
                  b.append("\nToplam encoder: ").append(count)
                   .append("\n720p60 bildiren donanim encoder: ").append(hw60)
                   .append("\nNot: TikTok sunucu sinirini veya gercek yayin FPS degerini olcmez.");
                  return b.toString();
              }

              private boolean support(MediaCodecInfo.VideoCapabilities v, int w, int h, int fps) {
                  try { return v.areSizeAndRateSupported(w, h, fps); }
                  catch (Exception ex) { return false; }
              }

              private String tryStart(String name, String mime, int w, int h) {
                  MediaCodec codec = null;
                  Surface surface = null;
                  boolean started = false;
                  try {
                      codec = MediaCodec.createByCodecName(name);
                      MediaFormat format = MediaFormat.createVideoFormat(mime, w, h);
                      format.setInteger(MediaFormat.KEY_COLOR_FORMAT,
                          MediaCodecInfo.CodecCapabilities.COLOR_FormatSurface);
                      format.setInteger(MediaFormat.KEY_BIT_RATE, 5000000);
                      format.setInteger(MediaFormat.KEY_FRAME_RATE, 60);
                      format.setInteger(MediaFormat.KEY_I_FRAME_INTERVAL, 2);
                      codec.configure(format, null, null, MediaCodec.CONFIGURE_FLAG_ENCODE);
                      surface = codec.createInputSurface();
                      codec.start();
                      started = true;
                      return "BASARILI (gercek FPS olculmedi)";
                  } catch (Exception ex) { return "HATA: " + ex.toString(); }
                  finally {
                      if (codec != null) {
                          if (started) try { codec.stop(); } catch (Exception ignored) { }
                          try { codec.release(); } catch (Exception ignored) { }
                      }
                      if (surface != null) surface.release();
                  }
              }
          }
          JAVA_END

      - name: APK olustur - Gradle kullanilmaz
        shell: bash
        run: |
          set -euo pipefail
          BT="$SDK/build-tools/35.0.0"
          PLATFORM="$SDK/platforms/android-35/android.jar"
          javac --release 8 -cp "$PLATFORM" -d build/classes src/com/astratest/codec/MainActivity.java
          jar cf build/classes.jar -C build/classes .
          "$BT/d8" --min-api 29 --lib "$PLATFORM" --output build/dex build/classes.jar
          "$BT/aapt2" link -o build/unsigned.apk -I "$PLATFORM" --manifest AndroidManifest.xml
          (cd build/dex && zip -q -0 ../unsigned.apk classes.dex)
          "$BT/zipalign" -f -p 4 build/unsigned.apk build/aligned.apk
          keytool -genkeypair -noprompt -keystore build/debug.jks -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
            -dname 'CN=Android Debug,O=Android,C=US'
          "$BT/apksigner" sign --ks build/debug.jks --ks-key-alias androiddebugkey \
            --ks-pass pass:android --key-pass pass:android \
            --out build/Astra-Codec-Test-V4.apk build/aligned.apk
          "$BT/apksigner" verify --verbose build/Astra-Codec-Test-V4.apk
          test -s build/Astra-Codec-Test-V4.apk
          echo 'APK imzalandi ve dogrulandi.'

      - name: APK dosyasini indirilebilir yap
        uses: actions/upload-artifact@v4
        with:
          name: Astra-Codec-Test-V4-APK
          path: build/Astra-Codec-Test-V4.apk
          if-no-files-found: error
