name: Replay Buton Ok Duzeltmesi

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Extract existing v2 source
        shell: bash
        run: |
          set -euo pipefail
          ZIP=$(find . -maxdepth 1 -type f -name 'ReplayGeriyeDonuk_v2_Ses_Mikrofon_Overlay*.zip' -print -quit)
          test -n "$ZIP" || { echo 'Project ZIP missing'; exit 1; }
          unzip -q -o "$ZIP" -d .
          test -f ReplayGeriyeDonuk_v2/app/build.gradle

      - name: Rotate only the inner arrow on button tap
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          
          p = Path('ReplayGeriyeDonuk_v2/app/src/main/java/com/example/replaygeri/ReplayService.java')
          s = p.read_text(encoding='utf-8')
          
          def replace_exact(before, after):
              global s
              n = s.count(before)
              if n != 1:
                  raise RuntimeError(f'Expected source pattern once, got {n}: {before[:80]!r}')
              s = s.replace(before, after, 1)
          
          replace_exact('private TextView overlay;', 'private View overlay;')
          replace_exact('bubble.setBackground(background);', '''android.widget.FrameLayout circle = new android.widget.FrameLayout(this);
                      circle.setBackground(background);
                      circle.setClickable(true);
                      circle.addView(bubble, new android.widget.FrameLayout.LayoutParams(-1, -1));''')
          replace_exact('bubble.setOnTouchListener(', 'circle.setOnTouchListener(')
          replace_exact('windowManager.updateViewLayout(bubble, params)', 'windowManager.updateViewLayout(circle, params)')
          replace_exact('windowManager.addView(bubble, params);', 'windowManager.addView(circle, params);')
          replace_exact('overlay = bubble;', 'overlay = circle;')
          replace_exact('overlayAnimator.setRepeatCount(ValueAnimator.INFINITE);', 'overlayAnimator.setRepeatCount(0);')
          replace_exact('overlayAnimator.setDuration(1100);', 'overlayAnimator.setDuration(850);')
          replace_exact('overlayAnimator.setRepeatCount(0);\n            overlayAnimator.start();',
                        'overlayAnimator.setRepeatCount(0);\n            // Wait for an actual tap to animate.')
          replace_exact('if (!moved) {', '''if (!moved) {
                                          if (overlayAnimator != null) {
                                              overlayAnimator.cancel();
                                              bubble.setRotation(0f);
                                              overlayAnimator.start();
                                          }''')
          
          p.write_text(s, encoding='utf-8')
          assert 'overlayAnimator.start();' in s
          assert 'overlayAnimator.setRepeatCount(0);' in s
          assert 'FrameLayout circle' in s
          print('OK: input touch, separate inner arrow, one-shot rotation')
          PY

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Android 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: ReplayGeriyeDonuk_v2
        run: gradle --no-daemon :app:assembleDebug

      - name: Publish APK
        uses: actions/upload-artifact@v4
        with:
          name: Replay-Tek-Tur-Ok-APK
          path: ReplayGeriyeDonuk_v2/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
