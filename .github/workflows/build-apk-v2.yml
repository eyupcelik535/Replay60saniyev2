on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack replay v2 project
        shell: bash
        run: |
          set -euo pipefail
          ZIP=$(find . -maxdepth 1 -type f -name 'ReplayGeriyeDonuk_v2_Ses_Mikrofon_Overlay*.zip' | head -n 1)
          if [ -z "$ZIP" ]; then
            echo 'Replay v2 project ZIP not found'
            exit 1
          fi
          unzip -q -o "$ZIP" -d .
          test -f ReplayGeriyeDonuk_v2/app/build.gradle

      - name: Fix tap-only inner arrow rotation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ReplayGeriyeDonuk_v2/app/src/main/java/com/example/replaygeri/ReplayService.java')
          s = p.read_text(encoding='utf-8')
          def change(old, new):
              global s
              n = s.count(old)
              if n != 1:
                  raise RuntimeError('Source pattern not found exactly once: ' + repr(old) + ', found ' + str(n))
              s = s.replace(old, new, 1)
          change('private TextView overlay;', 'private View overlay;')
          change('bubble.setBackground(background);', '''android.widget.FrameLayout circle = new android.widget.FrameLayout(this);
                      circle.setBackground(background);
                      circle.setClickable(true);
                      circle.addView(bubble, new android.widget.FrameLayout.LayoutParams(-1, -1));''')
          change('bubble.setOnTouchListener(', 'circle.setOnTouchListener(')
          change('windowManager.updateViewLayout(bubble, params)', 'windowManager.updateViewLayout(circle, params)')
          change('windowManager.addView(bubble, params);', 'windowManager.addView(circle, params);')
          change('overlay = bubble;', 'overlay = circle;')
          change('overlayAnimator.setRepeatCount(ValueAnimator.INFINITE);', 'overlayAnimator.setRepeatCount(0);')
          change('overlayAnimator.setDuration(1100);', 'overlayAnimator.setDuration(1000);')
          change('            overlayAnimator.start();\n        } catch', '            // The arrow rotates only when the button is pressed.\n        } catch')
          change('if (!moved) {\n                                Intent save =', '''if (!moved) {
                                      if (overlayAnimator != null) {
                                          overlayAnimator.cancel();
                                          bubble.setRotation(0f);
                                          overlayAnimator.start();
                                      }
                                      Intent save =''')
          p.write_text(s, encoding='utf-8')
          print('Verified: outer circle stationary, inner arrow spins once on tap')
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: ReplayGeriyeDonuk_v2
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Replay-Ok-Donus-APK
          path: ReplayGeriyeDonuk_v2/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
